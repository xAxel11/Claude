# Install the right GRUB flavour for this machine from the offline copies
# cached in the image (/var/lib/horizon/bootloader, see scripts/chroot-setup.sh).
---
dontChroot: false
timeout: 600
firmwareType:
    efi:
        - command: "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-download /var/lib/horizon/bootloader/efi/*.deb"
          timeout: 600
    bios:
        - command: "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-download /var/lib/horizon/bootloader/bios/*.deb"
          timeout: 600
