# Horizon OS — build configuration
# Every value here can be overridden from the environment, e.g.
#   sudo DISTRO_NAME="My OS" ./build.sh

# Branding --------------------------------------------------------------
DISTRO_NAME="${DISTRO_NAME:-Horizon OS}"
DISTRO_ID="${DISTRO_ID:-horizon}"            # lowercase, no spaces
DISTRO_VERSION="${DISTRO_VERSION:-1.0}"
DISTRO_CODENAME="${DISTRO_CODENAME:-dawn}"
DISTRO_URL="${DISTRO_URL:-https://github.com/xaxel11/claude}"

# Ubuntu base -----------------------------------------------------------
UBUNTU_SUITE="${UBUNTU_SUITE:-resolute}"     # 26.04 LTS (Plasma 6.6)
UBUNTU_MIRROR="${UBUNTU_MIRROR:-http://archive.ubuntu.com/ubuntu}"
ARCH="${ARCH:-amd64}"

# Live session ------------------------------------------------------------
LIVE_USER="${LIVE_USER:-horizon}"
LIVE_HOSTNAME="${LIVE_HOSTNAME:-horizon}"
DEFAULT_LOCALE="${DEFAULT_LOCALE:-en_US.UTF-8}"

# Theme sources (macOS look). Set to a tag/commit to pin a version.
WHITESUR_KDE_REF="${WHITESUR_KDE_REF:-master}"
WHITESUR_ICONS_REF="${WHITESUR_ICONS_REF:-master}"
WHITESUR_CURSORS_REF="${WHITESUR_CURSORS_REF:-master}"

# Output ----------------------------------------------------------------
BUILD_DIR="${BUILD_DIR:-$PWD/build}"
# zstd = fast build + fast boot, xz = smaller ISO
SQUASHFS_COMP="${SQUASHFS_COMP:-zstd}"
