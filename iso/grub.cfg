# Boot menu of the live ISO (placeholders are filled in by build.sh).
# Works for UEFI (Secure Boot signed GRUB) and legacy BIOS.
search --no-floppy --set=root --file /@DISTRO_ID@

set default=0
set timeout=10
set timeout_style=menu

# Graphical, themed menu. Only modules that the signed GRUB has built in are
# used (no insmod), so this also works with Secure Boot on.
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=1920x1080,1280x800,1024x768,auto
    set gfxpayload=keep
    terminal_output gfxterm
    if [ -e /boot/grub/themes/horizon/theme.txt ]; then
        loadfont /boot/grub/themes/horizon/horizon-regular-16.pf2
        loadfont /boot/grub/themes/horizon/horizon-regular-20.pf2
        loadfont /boot/grub/themes/horizon/horizon-bold-22.pf2
        loadfont /boot/grub/themes/horizon/horizon-bold-36.pf2
        set theme=/boot/grub/themes/horizon/theme.txt
        export theme
    fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Try or Install @DISTRO_NAME@" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper quiet splash ---
    initrd  /casper/initrd
}
menuentry "Try or Install @DISTRO_NAME@ (safe graphics)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd  /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" { fwsetup }
fi

submenu "Advanced options…" {
    menuentry "Load the whole system into memory (faster; USB can be removed)" {
        linux   /casper/vmlinuz boot=casper toram quiet splash ---
        initrd  /casper/initrd
    }
    menuentry "Verbose boot (for troubleshooting)" {
        linux   /casper/vmlinuz boot=casper systemd.show_status=1 ---
        initrd  /casper/initrd
    }
    menuentry "Safe graphics + verbose boot" {
        linux   /casper/vmlinuz boot=casper nomodeset systemd.show_status=1 ---
        initrd  /casper/initrd
    }
    menuentry "Check the USB stick / DVD for errors" {
        linux   /casper/vmlinuz boot=casper integrity-check quiet splash ---
        initrd  /casper/initrd
    }
    if [ "$grub_platform" = "efi" ]; then
        if [ -e /boot/memtest/mt86+x64 ]; then
            menuentry "Memory test (turn Secure Boot off first)" {
                linux /boot/memtest/mt86+x64
            }
        fi
        menuentry "Boot from the next device" { exit 1 }
        menuentry "UEFI Firmware Settings" { fwsetup }
    else
        if [ -e /boot/memtest/mt86+x64 ]; then
            menuentry "Memory test" {
                linux /boot/memtest/mt86+x64
            }
        fi
    fi
    menuentry "Restart" { reboot }
    menuentry "Shut down" { halt }
}
