# Boot menu of the live ISO (placeholders are filled in by build.sh)
search --no-floppy --set=root --file /@DISTRO_ID@

set default=0
set timeout=8
set timeout_style=menu

# Plain text menu: the signed (Secure Boot) GRUB can't load extra video modules.
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Try or Install @DISTRO_NAME@" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper quiet splash ---
    initrd  /casper/initrd
}
menuentry "@DISTRO_NAME@ (safe graphics)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd  /casper/initrd
}
menuentry "Check disc for defects" {
    linux   /casper/vmlinuz boot=casper integrity-check quiet splash ---
    initrd  /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" { fwsetup }
    menuentry "Boot from next volume" { exit 1 }
fi
